# dc1-clos-evpn-a  |  3-stage Clos, all Arista cEOS
# Host budget: 6x cEOS (2G/1vCPU) + 6x linux endpoints = ~12.5 GB RAM, ~7 vCPU
name: dc1-clos-evpn-a

mgmt:
  network: clab-dc1a
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.0.1F
      # docker IMAGE   | DISK USAGE | CONTENT SIZE
      # ceos:4.36.0.1F | 3.2GB      | 823MB
    linux:
      image: wbitt/network-multitool:alpine-extra
      # docker IMAGE                         | DISK USAGE | CONTENT SIZE
      # wbitt/network-multitool:alpine-extra | 345MB      | 76.9MB

  nodes:
    # ---------- spine tier ----------
    dc1-spine1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.101
      startup-config: configs/dc1-spine1.cfg

    dc1-spine2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.102
      startup-config: configs/dc1-spine2.cfg

    # ---------- leaf tier (VTEPs) ----------
    dc1-leaf1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/dc1-leaf1.cfg

    dc1-leaf2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
      startup-config: configs/dc1-leaf2.cfg

    dc1-leaf3:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.13
      startup-config: configs/dc1-leaf3.cfg

    dc1-leaf4:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.14
      startup-config: configs/dc1-leaf4.cfg

    # ---------- endpoints ----------
    h1:
      kind: linux
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.10.11/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.10.1
        - ip route add 192.168.200.0/24 via 172.16.10.1
    h2:
      kind: linux
      mgmt-ipv4: 172.20.20.22
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.10.12/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.10.1
        - ip route add 192.168.200.0/24 via 172.16.10.1
    h3:
      kind: linux
      mgmt-ipv4: 172.20.20.23
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.20.13/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.20.1
        - ip route add 192.168.200.0/24 via 172.16.20.1
    h4:
      kind: linux
      mgmt-ipv4: 172.20.20.24
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.20.14/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.20.1
        - ip route add 192.168.200.0/24 via 172.16.20.1
    h5:
      kind: linux
      mgmt-ipv4: 172.20.20.25
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.20.11/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.20.1
        - ip route add 192.168.200.0/24 via 172.16.20.1
    h6:
      kind: linux
      mgmt-ipv4: 172.20.20.26
      exec:
        - ip link set eth1 mtu 9000
        - ip addr add 172.16.10.13/24 dev eth1
        - ip route add 172.16.0.0/16 via 172.16.10.1
        - ip route add 192.168.200.0/24 via 172.16.10.1

  links:
    # spine1 Ethernet1..4  ->  leaf1..leaf4 Ethernet1
    - endpoints: ["dc1-spine1:eth1", "dc1-leaf1:eth1"]
    - endpoints: ["dc1-spine1:eth2", "dc1-leaf2:eth1"]
    - endpoints: ["dc1-spine1:eth3", "dc1-leaf3:eth1"]
    - endpoints: ["dc1-spine1:eth4", "dc1-leaf4:eth1"]
    # spine2 Ethernet1..4  ->  leaf1..leaf4 Ethernet2
    - endpoints: ["dc1-spine2:eth1", "dc1-leaf1:eth2"]
    - endpoints: ["dc1-spine2:eth2", "dc1-leaf2:eth2"]
    - endpoints: ["dc1-spine2:eth3", "dc1-leaf3:eth2"]
    - endpoints: ["dc1-spine2:eth4", "dc1-leaf4:eth2"]
    # endpoints
    - endpoints: ["dc1-leaf1:eth3", "h1:eth1"]
    - endpoints: ["dc1-leaf1:eth4", "h5:eth1"]
    - endpoints: ["dc1-leaf2:eth3", "h2:eth1"]
    - endpoints: ["dc1-leaf3:eth3", "h3:eth1"]
    - endpoints: ["dc1-leaf3:eth4", "h6:eth1"]
    - endpoints: ["dc1-leaf4:eth3", "h4:eth1"]
