! dc1-leaf4 | AS 65104 | VTEP 10.0.0.4 | compute leaf
! NOTE: spine2 uplink carries a deliberate egress bias, see README design intent.
service routing protocols model multi-agent
!
hostname dc1-leaf4
!
spanning-tree mode none
!
vlan 10
   name TENA-V10
!
vlan 20
   name TENA-V20
!
vrf instance TENANT-A
!
interface Ethernet1
   description to-dc1-spine1-Ethernet4
   no switchport
   mtu 9214
   ip address 10.1.0.7/31
!
interface Ethernet2
   description to-dc1-spine2-Ethernet4
   no switchport
   mtu 9214
   ip address 10.1.1.7/31
!
interface Ethernet3
   description h4-vlan20
   switchport access vlan 20
!
interface Loopback0
   description router-id-and-vtep
   ip address 10.0.0.4/32
!
interface Vlan10
   vrf TENANT-A
   mtu 9214
   ip address virtual 172.16.10.1/24
!
interface Vlan20
   vrf TENANT-A
   mtu 9214
   ip address virtual 172.16.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT-A vni 50001
!
ip virtual-router mac-address 00:1c:73:ba:be:01
!
ip routing
ip routing vrf TENANT-A
!
ip prefix-list PL-SELF-LOOPBACK seq 10 permit 10.0.0.4/32
!
ip community-list CL-EXT-PRIMARY permit 65000:200
!
route-map RM-SPINE2-OUT permit 10
   match ip address prefix-list PL-SELF-LOOPBACK
   set as-path prepend 65104 65104
!
route-map RM-SPINE2-OUT permit 20
!
route-map RM-EVPN-IN permit 10
   match community CL-EXT-PRIMARY
   set local-preference 200
!
route-map RM-EVPN-IN permit 20
!
router bgp 65104
   router-id 10.0.0.4
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp bestpath as-path multipath-relax
   neighbor SPINE peer group
   neighbor SPINE send-community
   neighbor SPINE maximum-routes 12000
   neighbor OVERLAY peer group
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 remote-as 65101
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 remote-as 65102
   neighbor 10.0.0.3 peer group OVERLAY
   neighbor 10.0.0.3 remote-as 65103
   neighbor 10.1.0.6 peer group SPINE
   neighbor 10.1.0.6 remote-as 65001
   neighbor 10.1.1.6 peer group SPINE
   neighbor 10.1.1.6 remote-as 65002
   !
   vlan 10
      rd 10.0.0.4:10010
      route-target both 9000:10010
      redistribute learned
   !
   vlan 20
      rd 10.0.0.4:10020
      route-target both 9000:10020
      redistribute learned
   !
   vrf TENANT-A
      rd 10.0.0.4:50001
      route-target import evpn 9000:50001
      route-target export evpn 9000:50001
      router-id 10.0.0.4
      redistribute connected
   !
   address-family evpn
      neighbor OVERLAY activate
      neighbor OVERLAY route-map RM-EVPN-IN in
   !
   address-family ipv4
      neighbor SPINE activate
      neighbor 10.1.1.6 route-map RM-SPINE2-OUT out
      network 10.0.0.4/32
!
end
