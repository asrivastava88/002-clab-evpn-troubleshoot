! dc1-spine2 | AS 65002 | underlay IP transit only, no EVPN state
service routing protocols model multi-agent
!
hostname dc1-spine2
!
spanning-tree mode none
!
interface Ethernet1
   description to-dc1-leaf1-Ethernet2
   no switchport
   mtu 9214
   ip address 10.1.1.0/31
!
interface Ethernet2
   description to-dc1-leaf2-Ethernet2
   no switchport
   mtu 9214
   ip address 10.1.1.2/31
!
interface Ethernet3
   description to-dc1-leaf3-Ethernet2
   no switchport
   mtu 9214
   ip address 10.1.1.4/31
!
interface Ethernet4
   description to-dc1-leaf4-Ethernet2
   no switchport
   mtu 9214
   ip address 10.1.1.6/31
!
interface Loopback0
   description router-id
   ip address 10.0.0.102/32
!
ip routing
!
ip prefix-list PL-FABRIC-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
!
route-map RM-UNDERLAY-OUT permit 20
   match ip address prefix-list PL-FABRIC-LOOPBACKS
!
route-map RM-UNDERLAY-OUT deny 99
!
router bgp 65002
   router-id 10.0.0.102
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp bestpath as-path multipath-relax
   neighbor LEAF peer group
   neighbor LEAF send-community
   neighbor LEAF maximum-routes 12000
   neighbor 10.1.1.1 peer group LEAF
   neighbor 10.1.1.1 remote-as 65101
   neighbor 10.1.1.3 peer group LEAF
   neighbor 10.1.1.3 remote-as 65102
   neighbor 10.1.1.5 peer group LEAF
   neighbor 10.1.1.5 remote-as 65103
   neighbor 10.1.1.7 peer group LEAF
   neighbor 10.1.1.7 remote-as 65104
   !
   address-family ipv4
      neighbor LEAF activate
      neighbor LEAF route-map RM-UNDERLAY-OUT out
      network 10.0.0.102/32
!
end
