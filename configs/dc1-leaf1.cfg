! dc1-leaf1 | AS 65101 | VTEP 10.0.0.1 | border leaf (BACKUP exit for 192.168.200.0/24)
service routing protocols model multi-agent
!
hostname dc1-leaf1
!
spanning-tree mode none
!
vlan 10
   name TENA-V10
!
vlan 20
   name TENA-V20
!
vrf instance TENANT-A
!
interface Ethernet1
   description to-dc1-spine1-Ethernet1
   no switchport
   mtu 9214
   ip address 10.1.0.1/31
!
interface Ethernet2
   description to-dc1-spine2-Ethernet1
   no switchport
   mtu 9214
   ip address 10.1.1.1/31
!
interface Ethernet3
   description h1-vlan10
   switchport access vlan 10
!
interface Ethernet4
   description h5-vlan20
   switchport access vlan 20
!
interface Loopback0
   description router-id-and-vtep
   ip address 10.0.0.1/32
!
interface Vlan10
   vrf TENANT-A
   mtu 9214
   ip address virtual 172.16.10.1/24
!
interface Vlan20
   vrf TENANT-A
   mtu 9214
   ip address virtual 172.16.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf TENANT-A vni 50001
!
ip virtual-router mac-address 00:1c:73:ba:be:01
!
ip routing
ip routing vrf TENANT-A
!
ip route vrf TENANT-A 192.168.200.0/24 Null0
!
ip prefix-list PL-EXT seq 10 permit 192.168.200.0/24
!
ip community-list CL-EXT-PRIMARY permit 65000:200
!
route-map RM-EXT-OUT permit 10
   match ip address prefix-list PL-EXT
   set community 65000:50
!
route-map RM-EVPN-IN permit 10
   match community CL-EXT-PRIMARY
   set local-preference 200
!
route-map RM-EVPN-IN permit 20
!
router bgp 65101
   router-id 10.0.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp bestpath as-path multipath-relax
   neighbor SPINE peer group
   neighbor SPINE send-community
   neighbor SPINE maximum-routes 12000
   neighbor OVERLAY peer group
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 remote-as 65102
   neighbor 10.0.0.3 peer group OVERLAY
   neighbor 10.0.0.3 remote-as 65103
   neighbor 10.0.0.4 peer group OVERLAY
   neighbor 10.0.0.4 remote-as 65104
   neighbor 10.1.0.0 peer group SPINE
   neighbor 10.1.0.0 remote-as 65001
   neighbor 10.1.1.0 peer group SPINE
   neighbor 10.1.1.0 remote-as 65002
   !
   vlan 10
      rd 10.0.0.1:10010
      route-target both 9000:10010
      redistribute learned
   !
   vlan 20
      rd 10.0.0.1:10020
      route-target both 9000:10020
      redistribute learned
   !
   vrf TENANT-A
      rd 10.0.0.1:50001
      route-target import evpn 9000:50001
      route-target export evpn 9000:50001
      router-id 10.0.0.1
      redistribute connected
      redistribute static route-map RM-EXT-OUT
   !
   address-family evpn
      neighbor OVERLAY activate
      neighbor OVERLAY route-map RM-EVPN-IN in
   !
   address-family ipv4
      neighbor SPINE activate
      network 10.0.0.1/32
!
end
